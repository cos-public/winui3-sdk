name: Build WinUI3 SDK snapshot

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  WINDOWS_APP_SDK_VERSION: 2.4.0
  CPPWINRT_VERSION: 3.0.260818.1

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build SDK snapshot
        id: build
        shell: pwsh
        run: |
          .\scripts\Build-WinUI3SDK.ps1 `
            -WindowsAppSDKVersion $env:WINDOWS_APP_SDK_VERSION `
            -CppWinRTVersion $env:CPPWINRT_VERSION `
            -Configuration Release `
            -IncludeRuntimeDlls

          $zipName = "winui3-sdk-$env:WINDOWS_APP_SDK_VERSION-cppwinrt-$env:CPPWINRT_VERSION.zip"
          $zip = Get-Item -LiteralPath (Join-Path artifacts $zipName) -ErrorAction Stop
          "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "zip_name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Publish nightly release
        if: github.ref == 'refs/heads/master' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          generate_release_notes: false
          target_commitish: ${{ github.sha }}
          body: |
            Latest nightly WinUI 3 SDK snapshot.

            Windows App SDK: ${{ env.WINDOWS_APP_SDK_VERSION }}
            C++/WinRT: ${{ env.CPPWINRT_VERSION }}
            Commit: ${{ github.sha }}
          files: ${{ steps.build.outputs.zip_path }}
          fail_on_unmatched_files: true

      - name: Remove previous nightly SDK assets
        if: github.ref == 'refs/heads/master' && success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
        run: |
          $releaseJson = gh release view nightly --json assets
          if ($LASTEXITCODE -ne 0) { throw "Failed to list nightly release assets." }
          $assets = ($releaseJson | ConvertFrom-Json).assets
          if ($env:ZIP_NAME -notin $assets.name) {
            throw "New SDK ZIP is missing from nightly; refusing to remove previous versions."
          }
          foreach ($asset in $assets) {
            if ($asset.name -like "winui3-sdk-*.zip" -and $asset.name -ne $env:ZIP_NAME) {
              gh release delete-asset nightly $asset.name --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete nightly asset '$($asset.name)'." }
            }
          }

      - name: Attach artifact to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip_path }}
          generate_release_notes: true
